services:
  - type: web
    name: sherzodbek-ai-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_NAME
        value: Sherzodbek
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
